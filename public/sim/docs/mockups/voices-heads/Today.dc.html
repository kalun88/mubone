<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The rail today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0a09;font-family:'Urbanist','Inter','Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#e8a030}a:hover{color:#f2b95c}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;box-sizing:border-box;border-radius:4px;background:rgba(255,240,224,0.030)}
.g{display:flex;width:20px;height:20px;flex-shrink:0}
.nm{flex-grow:1;font-size:12.48px;color:#c5c0b9}
.eyebrow{font-size:11.04px;letter-spacing:0.18em;text-transform:uppercase}
</style>
</helmet>
<div style="width: 420px; height: 900px; box-sizing: border-box; padding: 24px 20px; display: flex; flex-direction: column; gap: 18px; background: #0b0a09;">

  <div style="display: flex; flex-direction: column; gap: 3px;">
    <div style="font-size: 15.68px; color: #e4ddd0; font-weight: 600;">The rail today</div>
    <div style="font-size: 12.48px; color: #938d83;">Thirteen tools and two lenses. Four of them are one parameter wearing a name.</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px;">
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px; margin-bottom: 2px;">
      <span class="eyebrow" style="color: #f2569e;">tape</span>
      <span style="flex-grow: 1; height: 1px; background: rgba(255,240,224,0.055);"></span>
    </div>
    <button type="button" class="row">
      <span class="g" style="color: #f2569e;"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M3 16c3-7 6-9 9-5s6 2 9-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
      <span class="nm">line</span>
    </button>
    <button type="button" class="row">
      <span class="g" style="color: #f2569e;"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><g transform="translate(0 -4.5)"><path d="M3 16c3-7 6-9 9-5s6 2 9-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></g><g transform="translate(0 4.5)"><path d="M3 16c3-7 6-9 9-5s6 2 9-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></g></svg></span>
      <span class="nm">slice</span>
    </button>
    <button type="button" class="row">
      <span class="g" style="color: #f2569e;"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M19.25 8.62A8 8 0 1 1 15.38 4.75" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
      <span class="nm">loop</span>
      <span class="g" style="width: 16px; height: 16px; color: #f2569e;"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8.5" r="5"/><path d="M12 13.5v7.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></span>
    </button>
    <button type="button" class="row">
      <span class="g" style="color: #f2569e;"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12 4a8 8 0 1 1-7.1 4.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 8.5a3.5 3.5 0 1 1-3.1 1.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span>
      <span class="nm">dub</span>
      <span class="g" style="width: 16px; height: 16px; color: #f2569e;"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8.5" r="5"/><path d="M12 13.5v7.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></span>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px;">
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px; margin-bottom: 2px;">
      <span class="eyebrow" style="color: #be7ace;">erase</span>
      <span style="flex-grow: 1; height: 1px; background: rgba(255,240,224,0.055);"></span>
    </div>
    <button type="button" class="row">
      <span class="g" style="color: #be7ace;"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 19H9l-4.2-4.2a1.6 1.6 0 010-2.3l7.5-7.5a1.6 1.6 0 012.3 0l4.6 4.6a1.6 1.6 0 010 2.3L13 19" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></span>
      <span class="nm">scrape top</span>
    </button>
    <button type="button" class="row">
      <span class="g" style="color: #be7ace;"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 19H9l-4.2-4.2a1.6 1.6 0 010-2.3l7.5-7.5a1.6 1.6 0 012.3 0l4.6 4.6a1.6 1.6 0 010 2.3L13 19" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M5 21.4h15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
      <span class="nm">scrape bottom</span>
    </button>
    <button type="button" class="row">
      <span class="g" style="color: #be7ace;"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 19H9l-4.2-4.2a1.6 1.6 0 010-2.3l7.5-7.5a1.6 1.6 0 012.3 0l4.6 4.6a1.6 1.6 0 010 2.3L13 19" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="12" cy="12" r="10.4" fill="none" stroke="currentColor" stroke-width=".9" stroke-dasharray="2 2.6"/></svg></span>
      <span class="nm">scrape all</span>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px;">
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px; margin-bottom: 2px;">
      <span class="eyebrow" style="color: #e8a030;">granular</span>
      <span style="flex-grow: 1; height: 1px; background: rgba(255,240,224,0.055);"></span>
    </div>
    <button type="button" class="row">
      <span class="g" style="color: #e8a030;"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><circle cx="5" cy="4" r="2.1"/><circle cx="6.9" cy="12.7" r="2.1"/><circle cx="11.9" cy="18" r="2.1"/><circle cx="20" cy="20" r="2.1"/></svg></span>
      <span class="nm">dots</span>
      <span class="g" style="width: 16px; height: 16px; color: #938d83;"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3.4C9.2 7.4 6.6 10.4 6.6 13.6a5.4 5.4 0 0 0 10.8 0c0-3.2-2.6-6.2-5.4-10.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
    </button>
    <button type="button" class="row">
      <span class="g" style="color: #e8a030;"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><circle cx="19" cy="12" r="2.1"/><circle cx="15.5" cy="18.06" r="2.1"/><circle cx="8.5" cy="18.06" r="2.1"/><circle cx="5" cy="12" r="2.1"/><circle cx="8.5" cy="5.94" r="2.1"/><circle cx="15.5" cy="5.94" r="2.1"/></svg></span>
      <span class="nm">trail</span>
      <span class="g" style="width: 16px; height: 16px; color: #938d83;"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3.4C9.2 7.4 6.6 10.4 6.6 13.6a5.4 5.4 0 0 0 10.8 0c0-3.2-2.6-6.2-5.4-10.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
      <span class="g" style="width: 16px; height: 16px; color: #e8a030;"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8.5" r="5"/><path d="M12 13.5v7.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></span>
    </button>
    <button type="button" class="row">
      <span class="g" style="color: #e8a030;"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><circle cx="10" cy="12" r="3.2"/><circle cx="16" cy="8" r="1.6"/><circle cx="17.5" cy="13.5" r="1.1"/><circle cx="14.5" cy="17" r="1.3"/><circle cx="6" cy="7.5" r="1.2"/><circle cx="5.5" cy="16.5" r=".9"/><circle cx="20" cy="10.5" r=".7"/><circle cx="12" cy="5.5" r=".8"/></svg></span>
      <span class="nm">spray</span>
      <span class="g" style="width: 16px; height: 16px; color: #938d83;"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3.4C9.2 7.4 6.6 10.4 6.6 13.6a5.4 5.4 0 0 0 10.8 0c0-3.2-2.6-6.2-5.4-10.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
    </button>
    <button type="button" class="row">
      <span class="g" style="color: #e8a030;"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><rect x="3" y="6" width="3" height="12" rx="1"/><rect x="7.6" y="8" width="3" height="10" rx="1"/><rect x="12.2" y="10.5" width="3" height="7.5" rx="1"/><rect x="16.8" y="13" width="3" height="5" rx="1"/></svg></span>
      <span class="nm">comb</span>
      <span class="g" style="width: 16px; height: 16px; color: #938d83;"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3.4C9.2 7.4 6.6 10.4 6.6 13.6a5.4 5.4 0 0 0 10.8 0c0-3.2-2.6-6.2-5.4-10.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
    </button>
    <button type="button" class="row">
      <span class="g" style="color: #e8a030;"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M3 12h18" stroke="currentColor" stroke-width="1.1" opacity=".5"/><circle cx="6" cy="7" r="1.7"/><circle cx="11" cy="15.5" r="1.7"/><circle cx="16" cy="10" r="1.7"/><circle cx="20" cy="17" r="1.4"/></svg></span>
      <span class="nm">staff</span>
      <span class="g" style="width: 16px; height: 16px; color: #938d83;"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3.4C9.2 7.4 6.6 10.4 6.6 13.6a5.4 5.4 0 0 0 10.8 0c0-3.2-2.6-6.2-5.4-10.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
    </button>
    <button type="button" class="row">
      <span class="g" style="color: #e8a030;"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><rect x="3" y="9" width="4.5" height="6" rx="1"/><rect x="8.8" y="7" width="2.8" height="10" rx="1"/><rect x="12.9" y="10" width="4" height="4.5" rx="1"/><rect x="18.2" y="8" width="2.6" height="8" rx="1"/></svg></span>
      <span class="nm">match</span>
      <span class="g" style="width: 16px; height: 16px; color: #938d83;"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3.4C9.2 7.4 6.6 10.4 6.6 13.6a5.4 5.4 0 0 0 10.8 0c0-3.2-2.6-6.2-5.4-10.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px;">
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px; margin-bottom: 2px;">
      <span class="eyebrow" style="color: #5fbf9a;">lens</span>
      <span style="flex-grow: 1; height: 1px; background: rgba(255,240,224,0.055);"></span>
    </div>
    <button type="button" class="row">
      <span class="g" style="color: #5fbf9a;"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"/></svg></span>
      <span class="nm">wide</span>
    </button>
    <button type="button" class="row">
      <span class="g" style="color: #5fbf9a;"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 9.6l2.4 2.4-2.4 2.4-2.4-2.4z"/></svg></span>
      <span class="nm">spot</span>
    </button>
  </div>

  <div style="flex-grow: 1;"></div>
  <div style="font-size: 11.04px; color: #857e74; line-height: 1.6;">The drop is wet. The pin is on-end. Both read as properties of the tool; only one of them is.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":420,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
