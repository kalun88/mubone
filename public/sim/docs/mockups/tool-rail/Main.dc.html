<style>
body{margin:0;background:#000;font-family:Urbanist,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.rail{box-sizing:border-box;background:#0b0a09;border-right:1px solid rgba(255,240,224,.055);position:relative;overflow:hidden}
.bar{height:34px;box-sizing:border-box;padding:10px 12px;border-bottom:1px solid rgba(255,240,224,.055);display:flex;align-items:center}
.bar-t{font-size:11.04px;letter-spacing:1.99px;text-transform:uppercase;color:#aba59d;font-weight:500}
.list{box-sizing:border-box;padding:16px 12px 12px;display:flex;flex-direction:column;gap:12px}
.card{background:rgba(255,240,224,.05);border-radius:10px;padding-bottom:12px}
.card--panel{background:rgba(255,240,224,.05);border-radius:0 0 10px 10px;padding-bottom:12px}
.lbl{display:flex;align-items:center;box-sizing:border-box;padding:12px 12px 4px;font-size:11.04px;letter-spacing:1.99px;text-transform:uppercase;color:#857f76;line-height:13.5px}
.lbl .t{flex-grow:1}
.add{width:22.4px;height:24px;display:flex;align-items:center;justify-content:center;color:#938d83;border-radius:3px}
.add svg{width:12px;height:12px}
.tiles{display:flex;flex-direction:column;gap:6px}
.bare{padding-top:12px}
.trow{position:relative;height:24px;box-sizing:border-box;padding:0 12px;display:flex;align-items:center;gap:8.8px;color:#776f66}
.trow.on{background:rgba(255,240,224,.067);box-shadow:inset 0 1px 2px rgba(0,0,0,.45)}
.trow .ico{width:16.8px;height:16.8px;flex-shrink:0}
.trow .nm{flex-grow:1;font-size:14.08px;font-weight:500;color:#776f66}
.trow.on .nm{color:#e4ddd0}
.pal{position:absolute;left:-13px;top:7px;width:4px;height:10px;border-radius:0 3px 3px 0}
.more{width:22.4px;height:24px;display:flex;align-items:center;justify-content:center;color:#938d83}
.more svg{width:14px;height:14px}
.mrow{height:30px;box-sizing:border-box;padding:3px 12px;display:flex;align-items:center}
.mrow .l{flex-grow:1;font-size:14.08px;color:#aba59d}
.mrow.na .l{color:#776f66}
.sw{width:32px;height:18px;box-sizing:border-box;border-radius:999px;background:rgba(255,240,224,.13);padding:2px}
.sw span{display:block;width:14px;height:14px;border-radius:999px;background:#938d83}
.seg{height:24px;box-sizing:border-box;border-radius:999px;background:rgba(255,240,224,.05);padding:3px;display:flex;gap:1px}
.seg span{width:28.6px;height:18px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#5c564c}
.seg span.sel{background:rgba(255,240,224,.09);color:#776f66}
.seg span svg{width:15.2px;height:15.2px}
.tabs{display:flex;gap:1px}
.tab{height:32px;box-sizing:border-box;border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:center;
  background:rgba(255,240,224,.03);color:#776f66;padding:0 6px}
.tab.on{background:rgba(255,240,224,.05);color:#e8a030;gap:8px;padding:0 12px}
.tab svg{width:16.8px;height:16.8px;flex-shrink:0}
.tab .w{font-size:11.04px;letter-spacing:1.99px;text-transform:uppercase;white-space:nowrap}
</style>
</helmet>
